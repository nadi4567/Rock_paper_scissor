<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>rock_paper_scissor</title>
    <link href="./style.css" rel="stylesheet">
</head>
<body>
    <div id="congratsScreen">
        <h1>🎉 Congratulations! 🎉</h1>
    </div>    
    <h2>Rock_Paper_Scissors</h2>
    <h3 class="start">Start the game</h3>
    <div class="mainContainer">
       <p>Choose anything you want!</p>
       <p class="level_tle"></p>
       <div class="threeMain"> 
        <div class="rpsContainer" id="rock">
           <img src="./images/fist.png">
           <p>Rock</p>
        </div>
        <div class="rpsContainer" id="paper">
            <img src="./images/hand-paper.png">
            <p>Paper</p>
         </div>
         <div class="rpsContainer" id="scissor">
            <img src="./images/scissors.png">
            <p>Scissor</p>
         </div>
     </div>
     <p id="status"></p>
      <p id="user"></p>
      <p id="computer"></p>
     
    </div>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="./script.js"></script>
</body>
</html>
